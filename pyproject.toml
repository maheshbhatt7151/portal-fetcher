[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-fetcher"
version = "2.0.0"
description = "Auto-login and extract customer details from partner CRM portals"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "click>=8.1",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
portal-fetcher = "portal_fetcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
